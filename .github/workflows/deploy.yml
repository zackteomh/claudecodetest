name: Deploy Allied MFG to GitHub Pages

on:
  push:
    branches: [claude/eager-brahmagupta-dZJpx, main]
    paths:
      - "allied-mfg/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: allied-mfg/package-lock.json

      - name: Install dependencies
        working-directory: allied-mfg
        run: npm ci

      - name: Build static export
        working-directory: allied-mfg
        env:
          NEXT_PUBLIC_BASE_PATH: /claudecodetest
        run: npm run build

      - name: Add .nojekyll
        run: touch allied-mfg/out/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: allied-mfg/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
